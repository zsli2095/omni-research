<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Research - Vocoders</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="vocoders.jsx"></script>

    <script type="text/babel">
        const renderApp = () => {
            try {
                const root = ReactDOM.createRoot(document.getElementById('root'));
                // Changed from <App /> to match your actual function name!
                root.render(<AudioModelComparison />);
            } catch (err) {
                console.error("Render error:", err);
            }
        };

        // Give Babel a moment to transform the external vocoders.jsx
        setTimeout(renderApp, 200);
    </script>

</body>
</html>
